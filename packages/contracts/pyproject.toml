[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_contracts*"]

[tool.setuptools.package-data]
cil_contracts = ["resources/**/*.json", "resources/**/*.sql", "resources/*.json"]
