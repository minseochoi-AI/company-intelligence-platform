[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-integrations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-contracts", "cil-domain", "cil-application", "duckdb>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_integrations*"]

[project.optional-dependencies]
xlsx-verify = ["openpyxl>=3.1,<4"]

[tool.setuptools.package-data]
cil_integrations = ["resources/*.json", "resources/sql/*.sql"]
