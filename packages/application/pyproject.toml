[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-application"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-contracts", "cil-domain", "pandas>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_application*"]
