[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-reporting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-contracts", "cil-domain"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_reporting*"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]
