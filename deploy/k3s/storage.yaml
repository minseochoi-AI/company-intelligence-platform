apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: company-data
  namespace: company-intelligence
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: company-artifacts
  namespace: company-intelligence
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

