[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-cli", "cil-api"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["company_intel*"]

[project.optional-dependencies]
xlsx = ["cil-reporting[xlsx]", "cil-integrations[xlsx-verify]"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
cil-contracts = { workspace = true }
cil-domain = { workspace = true }
cil-application = { workspace = true }
cil-integrations = { workspace = true }
cil-reporting = { workspace = true }
cil-cli = { workspace = true }
cil-api = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
