[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-contracts", "cil-domain", "cil-application", "cil-integrations", "cil-reporting", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_api*"]
