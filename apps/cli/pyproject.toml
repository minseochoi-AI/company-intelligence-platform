[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cil-contracts", "cil-domain", "cil-application", "cil-integrations", "cil-reporting"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cil_cli*"]

[project.scripts]
company-intel = "cil_cli.main:main"
